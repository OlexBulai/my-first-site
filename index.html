<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой список товаров</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-panel">
        <h1>Инвентарь товаров</h1>
        <p class="subtitle">Добавляй предметы в список</p>

        <div class="form-box">
            <input id="name" type="text" placeholder="Название предмета">
            <input id="price" type="number" placeholder="Цена предмета">
            <button onclick="addProduct()">Добавить в инвентарь</button>
        </div>

        <p id="message" class="message"></p>

        <div class="inventory-box">
            <h2>Инвентарь</h2>
            <ul id="products"></ul>
        </div>

        <div class="total-box">
            <h3 id="total">Итого: 0 грн</h3>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
